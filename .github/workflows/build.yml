name: Build and Release Geode Mod

on:
  push:
    tags:
      - 'v1.0.0' # Авто-сборка при создании любого тега, начинающегося с "v" (например, v1.0.0)
  workflow_dispatch: # Добавляет кнопку "Run workflow" для ручного запуска вкладке Actions

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: Windows

      - name: Release Artifacts
        if: startsWith(github.ref, 'refs/tags/') # Загружает в релизы только если запуск был по тегу
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.geode
            build/**/*.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
